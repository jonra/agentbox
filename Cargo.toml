[package]
name = "agentbox"
version = "0.1.0"
edition = "2021"
description = "A tiny Docker-like runner for AI agents: pulls OCI images and runs them in libkrun microVMs"
license = "Apache-2.0"
repository = "https://github.com/jonra/agentbox"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
